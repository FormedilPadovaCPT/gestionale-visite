name: Schema del database (notturno)

# (13/11/2026) IL DATABASE HA UN SORGENTE DA LEGGERE.
#
# I file in supabase/sql dei repo sono appunti datati di ciò che è stato
# applicato, non lo schema: 31 funzioni chiamate dal codice non avevano un
# file, 72 erano ridefinite in più file, e quale fosse la versione vera lo
# sapeva solo il database. Ogni notte questo giro estrae il SOLO SCHEMA
# (tabelle, funzioni, trigger, policy, permessi — nessun dato) e lo deposita
# su Drive in _SISTEMA/schema_db/, sempre sullo stesso file:
#   - Drive ne tiene le versioni;
#   - sul PC dell'ufficio la cartella è dentro il git del vault (locale,
#     privato), quindi ogni cambio al database si vede riga per riga.
#
# ⚠️ Questo repository è PUBBLICO: lo schema NON va mai stampato nei log, né
# caricato come artifact. Va solo su Drive. Per questo niente `cat`, niente
# `set -x`, e gli errori di pg_dump si riassumono senza riportarne il testo.
#
# Diverso dal backup (backup-db.yml), che ha i dati ed è cifrato: qui non c'è
# un solo dato, e il file deve restare leggibile.

on:
  schedule:
    - cron: '40 2 * * *'   # ogni notte, dopo il backup delle 02:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/schema-db.yml']

permissions:
  contents: read

concurrency:
  group: schema-db
  cancel-in-progress: false

jobs:
  schema:
    runs-on: ubuntu-24.04   # fisso, come backup-db.yml: pg_dump 17 arriva dal repo PGDG di questa versione
    steps:
      - name: Installa client PostgreSQL 17
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Estrae lo schema (senza dati, senza stampare niente)
        id: estrai
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          [ -n "${DB_URL:-}" ] || { echo "Secret SUPABASE_DB_URL mancante."; exit 1; }
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          mkdir -p fuori
          # i log di questo repository sono pubblici e non si possono leggere senza
          # accesso: a che punto ci si ferma, e perché, lo si porta nel verdetto
          # (che sta nel database, privato), non qui
          fase() { echo "FASE=$1" >> "$GITHUB_ENV"; }
          fase pg_dump
          # 1. schema applicativo, CON i permessi (grant/revoke): sono parte della
          #    sicurezza, e il backup dei dati non li porta (--no-privileges)
          if ! pg_dump "$DB_URL" --schema-only --no-owner \
                 --schema=public --schema=planning --schema=cpt_admin --schema=archivio \
                 > fuori/grezzo.sql 2> fuori/errori.txt; then
            echo "pg_dump non riuscito ($(wc -l < fuori/errori.txt) righe di errore, non riportate: il repository è pubblico)"
            tr '\n' ' ' < fuori/errori.txt | head -c 500 > fuori/motivo.txt
            exit 1
          fi
          # righe che cambiano a ogni giro senza che lo schema sia cambiato:
          # la chiave casuale di \restrict (pg_dump 17.6+) e le versioni in testa
          grep -vE '^\\(un)?restrict |^-- Dumped (from|by) ' fuori/grezzo.sql > fuori/gestionale_schema.sql
          rm -f fuori/grezzo.sql fuori/errori.txt

          # 2. il contorno che pg_dump degli schemi applicativi non vede: lavori
          #    programmati, policy dello storage, tabelle in tempo reale, estensioni,
          #    bucket. Niente valori di configurazione: solo struttura.
          fase contorno
          psql "$DB_URL" -q -At -v ON_ERROR_STOP=1 > fuori/gestionale_contorno.sql 2> fuori/motivo.txt <<'SQL'
          select '-- CONTORNO DELLO SCHEMA: ciò che sta fuori dagli schemi applicativi.' ||
                 E'\n-- Si rigenera ogni notte (gestionale-visite/.github/workflows/schema-db.yml). Non è un file da eseguire.';
          select E'\n-- ══ LAVORI PROGRAMMATI (pg_cron) ══';
          select format(E'\n-- %s · %s · %s\n%s', jobname, schedule, case when active then 'attivo' else 'SPENTO' end, command)
            from cron.job order by jobname;
          select E'\n-- ══ ESTENSIONI ══';
          select format('-- %s %s (schema %s)', e.extname, e.extversion, n.nspname)
            from pg_extension e join pg_namespace n on n.oid = e.extnamespace order by 1;
          select E'\n-- ══ BUCKET DELLO STORAGE ══';
          select format('-- %s · pubblico: %s · limite: %s · tipi: %s', id, public, coalesce(file_size_limit::text, 'nessuno'), coalesce(array_to_string(allowed_mime_types, ', '), 'tutti'))
            from storage.buckets order by id;
          select E'\n-- ══ POLICY DELLO STORAGE ══';
          select format(E'\n-- %s.%s · %s · %s · ruoli: %s\n-- USING: %s\n-- WITH CHECK: %s', schemaname, tablename, policyname, cmd, array_to_string(roles, ', '), coalesce(qual, '—'), coalesce(with_check, '—'))
            from pg_policies where schemaname = 'storage' order by tablename, policyname;
          select E'\n-- ══ TABELLE IN TEMPO REALE ══';
          select format('-- %s · %s.%s', pubname, schemaname, tablename) from pg_publication_tables order by 1, 2, 3;
          select E'\n-- ══ FUNZIONI CHE SCATTANO SUGLI UTENTI (trigger su auth) ══';
          select format('-- %s su %s.%s → %s', t.tgname, n.nspname, c.relname, p.proname)
            from pg_trigger t join pg_class c on c.oid = t.tgrelid join pg_namespace n on n.oid = c.relnamespace
            join pg_proc p on p.oid = t.tgfoid
            where n.nspname in ('auth', 'storage') and not t.tgisinternal order by 1;
          SQL

          rm -f fuori/motivo.txt
          fase controlli
          # numeri per il verdetto (solo conteggi: nessun contenuto nei log)
          {
            echo "kb=$(( $(wc -c < fuori/gestionale_schema.sql) / 1024 ))"
            echo "tabelle=$(grep -c '^CREATE TABLE ' fuori/gestionale_schema.sql || true)"
            echo "funzioni=$(grep -cE '^CREATE (OR REPLACE )?(FUNCTION|PROCEDURE) ' fuori/gestionale_schema.sql || true)"
            echo "policy=$(grep -c '^CREATE POLICY ' fuori/gestionale_schema.sql || true)"
          } >> "$GITHUB_OUTPUT"
          fase deposito
          # un dump troppo piccolo è un dump sbagliato: meglio fermarsi che sovrascrivere quello buono
          [ "$(grep -c '^CREATE TABLE ' fuori/gestionale_schema.sql)" -ge 150 ] || { echo "Schema con troppe poche tabelle: non lo deposito."; exit 1; }
          [ "$(grep -cE '^CREATE (OR REPLACE )?(FUNCTION|PROCEDURE) ' fuori/gestionale_schema.sql)" -ge 300 ] || { echo "Schema con troppe poche funzioni: non lo deposito."; exit 1; }

      - name: Deposita su Drive in _SISTEMA/schema_db (stesso file, versioni di Drive)
        id: drive
        env:
          GSA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          [ -n "${GSA_JSON:-}" ] || { echo "Secret GOOGLE_SERVICE_ACCOUNT_JSON assente: non posso depositare."; exit 1; }
          pip -q install google-auth requests
          python3 - <<'PY'
          import os, json, hashlib, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          info = json.loads(os.environ['GSA_JSON'].lstrip('﻿\r\n\t ').strip())
          creds = service_account.Credentials.from_service_account_info(
              info, scopes=['https://www.googleapis.com/auth/drive'],
              subject='cptpd@did.formedilpadova.it')
          creds.refresh(Request())
          H = {'Authorization': f'Bearer {creds.token}'}
          API = 'https://www.googleapis.com/drive/v3/files'
          CARTELLA = 'application/vnd.google-apps.folder'

          def figli(genitore, nome, cartella):
              q = (f"name = '{nome}' and '{genitore}' in parents and trashed = false"
                   + (f" and mimeType = '{CARTELLA}'" if cartella else ''))
              r = requests.get(API, params={'q': q, 'fields': 'files(id,name,md5Checksum)'}, headers=H)
              r.raise_for_status()
              return r.json().get('files', [])

          # _SISTEMA sta nella radice del Drive e DEVE esistere (è la cartella del vault):
          # se non si trova ci si ferma, non la si crea a caso da un'altra parte
          sis = figli('root', '_SISTEMA', True)
          if len(sis) != 1:
              raise SystemExit(f"_SISTEMA nella radice del Drive: trovate {len(sis)} cartelle, ne serve una")
          dest = figli(sis[0]['id'], 'schema_db', True)
          if dest:
              did = dest[0]['id']
          else:
              c = requests.post(API, headers={**H, 'Content-Type': 'application/json'},
                                json={'name': 'schema_db', 'mimeType': CARTELLA, 'parents': [sis[0]['id']]})
              c.raise_for_status(); did = c.json()['id']

          cambiati = []
          for nome in ('gestionale_schema.sql', 'gestionale_contorno.sql'):
              dati = open(os.path.join('fuori', nome), 'rb').read()
              md5 = hashlib.md5(dati).hexdigest()
              gia = figli(did, nome, False)
              if gia and gia[0].get('md5Checksum') == md5:
                  continue          # identico a ieri: non si crea una versione vuota
              if gia:
                  r = requests.patch(f"https://www.googleapis.com/upload/drive/v3/files/{gia[0]['id']}?uploadType=media",
                                     headers={**H, 'Content-Type': 'text/plain; charset=utf-8'}, data=dati)
              else:
                  ini = requests.post('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable',
                                      headers={**H, 'Content-Type': 'application/json'},
                                      json={'name': nome, 'parents': [did], 'mimeType': 'text/plain'})
                  ini.raise_for_status()
                  r = requests.put(ini.headers['Location'], data=dati)
              r.raise_for_status()
              cambiati.append(nome)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('depositato=si', file=out)
              print('cambiati=' + ','.join(cambiati), file=out)
          print('Depositato. File cambiati rispetto a ieri:', len(cambiati))
          PY

      # Il silenzio non è un esito: una riga ogni notte in s_test_automatici
      # (suite «schema»), che il cruscotto della segreteria mostra.
      - name: Registra il verdetto in s_test_automatici
        if: always()
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STATO: ${{ job.status }}
          DEPOSITATO: ${{ steps.drive.outputs.depositato }}
          CAMBIATI: ${{ steps.drive.outputs.cambiati }}
          KB: ${{ steps.estrai.outputs.kb }}
          TABELLE: ${{ steps.estrai.outputs.tabelle }}
          FUNZIONI: ${{ steps.estrai.outputs.funzioni }}
          POLICY: ${{ steps.estrai.outputs.policy }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "${DB_URL:-}" ] || { echo "SUPABASE_DB_URL assente: non posso registrare"; exit 0; }
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          if [ "$STATO" = success ] && [ "${DEPOSITATO:-}" = si ]; then esito=riuscita; fase=""; else esito=fallita; fase="${FASE:-avvio}"; fi
          motivo=$(head -c 500 fuori/motivo.txt 2>/dev/null | tr '\n' ' ' || true)
          psql "$DB_URL" -q -v ON_ERROR_STOP=1 -v fase="$fase" -v motivo="$motivo" -v esito="$esito" -v kb="${KB:-}" -v tabelle="${TABELLE:-}" -v funzioni="${FUNZIONI:-}" -v policy="${POLICY:-}" -v cambiati="${CAMBIATI:-}" -v run="$RUN_URL" <<'SQL'
          insert into public.s_test_automatici (suite, esito, passati, falliti, run_url, dettaglio)
          values ('schema', :'esito', nullif(:'kb', '')::int, 0, :'run',
                  jsonb_strip_nulls(jsonb_build_object(
                    'tabelle', nullif(:'tabelle', '')::int, 'funzioni', nullif(:'funzioni', '')::int,
                    'policy', nullif(:'policy', '')::int, 'file_cambiati', nullif(:'cambiati', ''),
                    'fermo_a', nullif(:'fase', ''), 'motivo', nullif(:'motivo', ''))));
          SQL
          echo "Verdetto registrato: $esito"

name: Deploy sito (Pages) con validazione

# Pubblica il gestionale su GitHub Pages SOLO se index.html supera il controllo
# d'integrità (anti-troncamento). Un file rotto NON va mai online: resta l'ultima
# versione valida. Pubblica solo i file necessari (non i .bak/.sql/.json interni).
#
# ATTIVAZIONE (una tantum): Settings -> Pages -> Build and deployment ->
#   Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app-data.js'
      - 'stage-relazione.js'
      - '*.png'
      - '.github/workflows/deploy-pages.yml'
      - 'tools/valida_index.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Validazione integrità index.html (gate)
        run: python3 tools/valida_index.py index.html

      - name: Prepara i soli file pubblici
        run: |
          set -e
          mkdir -p _site
          cp index.html _site/
          # Tutto ciò che index.html carica va pubblicato: il 05/09/2026
          # stage-relazione.js era in repo ma 404 su Pages (la relazione stage
          # non esisteva in produzione e il typeof lo nascondeva).
          for f in app-data.js stage-relazione.js *.png; do
            [ -f "$f" ] && cp "$f" _site/ || true
          done
          # .nojekyll evita l'elaborazione Jekyll (serve i file così come sono)
          touch _site/.nojekyll

      - name: Ogni script locale referenziato da index.html deve stare in _site
        run: |
          set -e
          for f in $(grep -oE '<script[^>]+src="[^"]+"' index.html | sed -E 's/.*src="([^"]+)".*/\1/' | grep -vE '^https?://'); do
            test -f "_site/$f" || { echo "::error::$f è referenziato da index.html ma non viene pubblicato"; exit 1; }
          done
          echo "Script locali pubblicati: ok"

      - name: Carica artifact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

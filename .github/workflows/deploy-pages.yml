name: Deploy sito (Pages) con validazione

# Pubblica il gestionale su GitHub Pages SOLO se index.html supera il controllo
# d'integrità (anti-troncamento). Un file rotto NON va mai online: resta l'ultima
# versione valida. Pubblica solo i file necessari (non i .bak/.sql/.json interni).
#
# ATTIVAZIONE (una tantum): Settings -> Pages -> Build and deployment ->
#   Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app-data.js'
      - 'stage-relazione.js'
      - 'diniego-accesso.js'
      - 'cantieri-critici-coord.js'
      - 'controllo-verbale.js'
      - 'riepilogo-verbali.js'
      - 'scheda-impresa.js'
      - 'notifiche.js'
      - 'aiuto.js'
      - 'mail-respinte-tec.js'
      - 'proposte-chiusura.js'
      - 'codice-univoco.js'
      - 'appunti-cantiere.js'
      - 'direzione.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'osservatorio.js'
      - 'manuali.js'
      - 'mappa.js'
      - 'mappa.css'
      - 'verbale-pdf.js'
      - 'logo-pdf.jpg'
      - '*.png'
      - '.github/workflows/deploy-pages.yml'
      - 'tools/valida_index.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Validazione integrità index.html (gate)
        run: python3 tools/valida_index.py index.html

      - name: Prepara i soli file pubblici
        run: |
          set -e
          mkdir -p _site
          cp index.html _site/
          # Tutto ciò che index.html carica va pubblicato: il 05/09/2026
          # stage-relazione.js era in repo ma 404 su Pages (la relazione stage
          # non esisteva in produzione e il typeof lo nascondeva).
          for f in app-data.js stage-relazione.js diniego-accesso.js cantieri-critici-coord.js controllo-verbale.js riepilogo-verbali.js scheda-impresa.js notifiche.js aiuto.js mail-respinte-tec.js proposte-chiusura.js codice-univoco.js appunti-cantiere.js direzione.js sw.js manifest.webmanifest osservatorio.js manuali.js mappa.js mappa.css verbale-pdf.js logo-pdf.jpg *.png; do
            [ -f "$f" ] && cp "$f" _site/ || true
          done
          # .nojekyll evita l'elaborazione Jekyll (serve i file così come sono)
          touch _site/.nojekyll

      - name: Sintassi JavaScript (node --check sul modulo inline, sugli script inline classici e su ogni script locale)
        run: |
          set -e
          mkdir -p _chk
          # il modulo inline e gli script inline classici di index.html vanno
          # estratti per essere controllati (26/09/2026: prima si guardava solo
          # il modulo, e un errore in uno script classico passava)
          python3 - <<'PY'
          import re
          s = open('index.html', encoding='utf-8').read()
          m = re.search(r'<script type="module">\n(.*?)\n</script>', s, re.S)
          assert m, 'modulo inline non trovato'
          open('_chk/inline.mjs', 'w', encoding='utf-8').write(m.group(1))
          n = 0
          for mm in re.finditer(r'<script([^>]*)>(.*?)</script>', s, re.S):
              attr = mm.group(1)
              if 'src=' in attr or 'type=' in attr and 'javascript' not in attr:
                  continue   # esterni, il modulo (già estratto) e i blocchi non JS
              n += 1
              open('_chk/classico_%02d.js' % n, 'w', encoding='utf-8').write(mm.group(2))
          assert n, 'nessuno script inline classico trovato'
          print('script inline classici:', n)
          PY
          node --check _chk/inline.mjs
          for f in _chk/classico_*.js; do node --check "$f"; done
          for f in _site/*.js; do
            cp "$f" "_chk/$(basename "$f" .js).mjs"
            node --check "_chk/$(basename "$f" .js).mjs" || node --check "$f"
          done
          echo "Sintassi ok"

      - name: Ogni script locale referenziato da index.html deve stare in _site
        run: |
          set -e
          for f in $(grep -oE '<script[^>]+src="[^"]+"' index.html | sed -E 's/.*src="([^"?]+).*/\1/' | grep -vE '^https?://'); do
            test -f "_site/$f" || { echo "::error::$f è referenziato da index.html ma non viene pubblicato"; exit 1; }
          done
          # il ?v=N serve solo a scavalcare la cache dei browser: il file e' lo stesso
          echo "Script locali pubblicati: ok"

      - name: Carica artifact Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

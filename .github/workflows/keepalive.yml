name: Keepalive Supabase

on:
  schedule:
    - cron: '0 5 */2 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: https://utdantrfugnmqsuujxbe.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV0ZGFudHJmdWdubXFzdXVqeGJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNjEzMTYsImV4cCI6MjA5MzgzNzMxNn0.L6YUgMD9rYPtqZCn5-c6hB-ok5nSCISpSolj_a-pcmM
        run: |
          status=$(curl -s -o /tmp/resp.json -w "%{http_code}" "$SUPABASE_URL/rest/v1/tecnici?select=tecnico_id&limit=1" -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP status: $status"
          cat /tmp/resp.json
          if [ "$status" -ge 400 ]; then
            echo "Richiesta a Supabase fallita (status $status)"
            exit 1
          fi
          echo "Ping OK - progetto Supabase attivo."

name: Prova di ripristino del backup

# Un backup che non si è mai riaperto è una speranza, non una garanzia.
# Questo workflow prende l'ULTIMO backup cifrato dalla cartella Drive
# "Backup_Gestionale" (la copia che useremmo davvero in un'emergenza), lo
# decifra con la stessa passphrase, lo ricarica in un Postgres vuoto con
# l'immagine ufficiale di Supabase (stessa versione 17.6, stesse estensioni,
# stessi ruoli anon/authenticated/service_role) e poi CONTA le righe di ogni
# tabella.
#
# Il verdetto si dà confrontando il RIPRISTINATO con il DUMP stesso (le righe
# dentro i blocchi COPY del file): una tabella è a posto quando torna con
# esattamente le righe che il backup conteneva. Il confronto con il database
# VIVO è solo informativo: dice quanto lavoro è passato dalle 04:00 a ora
# (righe in più, tabelle nate dopo il backup) e non fa fallire la prova.
# Lo schema auth è informativo anche lui: nell'immagine ha una struttura sua,
# per ripristinarlo lo si svuota prima.
#
# Il risultato viene scritto anche nella tabella public.s_backup_prove del
# database vivo (creata da qui se manca, leggibile da segreteria e
# coordinatore): così l'ufficio vede quando è stata fatta l'ultima prova e
# come è andata, senza aprire GitHub.
#
# Secret usati (gli stessi del backup): SUPABASE_DB_URL, BACKUP_PASSPHRASE,
# GOOGLE_SERVICE_ACCOUNT_JSON. Nessun dato in chiaro lascia il runner: il
# database ripristinato vive nel container e muore con il job.
#
# Prima esecuzione 26/09/2026: con l'utente postgres (che nell'immagine
# Supabase NON è superutente) lo schema auth era inscrivibile e auth.jwt()
# mancava: 329 errori a cascata. Da allora si ripristina come supabase_admin
# su uno schema auth svuotato.

on:
  schedule:
    - cron: '30 3 1 * *'    # il 1° di ogni mese alle 03:30 UTC, dopo il backup delle 02:00
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-test.yml'

permissions:
  contents: read

jobs:
  ripristino:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      db:
        image: supabase/postgres:17.6.1.177
        env:
          POSTGRES_PASSWORD: prova-ripristino
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      # supabase_admin è il superutente dell'immagine; postgres no (come sul servizio ospitato)
      TARGET_URL: postgresql://supabase_admin:prova-ripristino@localhost:5432/postgres
    steps:
      - name: Installa client PostgreSQL 17
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Scarica l'ultimo backup da Drive (Backup_Gestionale)
        env:
          GSA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GSA_JSON:-}" ]; then
            echo "Secret GOOGLE_SERVICE_ACCOUNT_JSON assente: senza Drive la prova non ha senso."; exit 1
          fi
          pip -q install google-auth requests
          python3 - <<'PY'
          import os, json, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          info = json.loads(os.environ['GSA_JSON'].lstrip('﻿\r\n\t ').strip())
          creds = service_account.Credentials.from_service_account_info(
              info, scopes=['https://www.googleapis.com/auth/drive'],
              subject='cptpd@did.formedilpadova.it')
          creds.refresh(Request())
          H = {'Authorization': f'Bearer {creds.token}'}
          q = "name = 'Backup_Gestionale' and mimeType = 'application/vnd.google-apps.folder' and trashed = false"
          r = requests.get('https://www.googleapis.com/drive/v3/files', params={'q': q, 'fields': 'files(id)'}, headers=H).json()
          if not r.get('files'):
              raise SystemExit('Cartella Backup_Gestionale non trovata su Drive')
          fid = r['files'][0]['id']
          q2 = f"'{fid}' in parents and name contains 'backup_' and trashed = false"
          files = requests.get('https://www.googleapis.com/drive/v3/files',
                               params={'q': q2, 'fields': 'files(id,name,size,modifiedTime)', 'pageSize': 200},
                               headers=H).json().get('files', [])
          if not files:
              raise SystemExit('Nessun backup_* nella cartella Backup_Gestionale')
          ult = sorted(files, key=lambda f: f['name'])[-1]
          print('Ultimo backup su Drive:', ult['name'], ult.get('size'), 'byte, modificato', ult.get('modifiedTime'))
          with requests.get(f"https://www.googleapis.com/drive/v3/files/{ult['id']}?alt=media", headers=H, stream=True) as d:
              d.raise_for_status()
              with open(ult['name'], 'wb') as f:
                  for chunk in d.iter_content(1 << 20):
                      f.write(chunk)
          with open(os.environ['GITHUB_ENV'], 'a') as e:
              e.write(f"BACKUP_NOME={ult['name']}\n")
          PY
          ls -l backup_*.sql.gz.gpg

      - name: Decifra e scompatta
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          [ -n "${PASS:-}" ] || { echo "Secret BACKUP_PASSPHRASE assente."; exit 1; }
          gpg --batch --yes --passphrase "$PASS" -d "$BACKUP_NOME" | gunzip > backup.sql
          ls -l backup.sql
          echo "Blocchi COPY nel dump: $(grep -c '^COPY ' backup.sql)"

      - name: Prepara il Postgres vuoto (schema auth svuotato, estensioni che il dump dà per scontate)
        run: |
          set -euo pipefail
          psql "$TARGET_URL" -v ON_ERROR_STOP=1 \
            -c "select version(), current_user, (select rolsuper from pg_roles where rolname = current_user) as superuser;" \
            -c "drop schema if exists auth cascade;" \
            -c "create schema auth;" \
            -c "grant usage on schema auth to postgres, anon, authenticated, service_role;" \
            -c "create extension if not exists pg_trgm with schema public;" \
            -c "create extension if not exists btree_gist with schema public;" \
            -c "create extension if not exists pg_net;" \
            -c "create extension if not exists pgcrypto with schema extensions;" \
            -c "create extension if not exists \"uuid-ossp\" with schema extensions;" \
            -c "create extension if not exists http with schema extensions;"

      - name: Ripristina il dump nel container
        run: |
          set -uo pipefail
          inizio=$(date +%s)
          psql "$TARGET_URL" -q -v ON_ERROR_STOP=0 -f backup.sql > restore.out 2> restore.err
          echo "DURATA_RESTORE=$(( $(date +%s) - inizio ))" >> "$GITHUB_ENV"
          n=$(grep -c '^psql:.*ERROR' restore.err || true)
          echo "Errori durante il ripristino: $n"
          echo "ERRORI_RESTORE=$n" >> "$GITHUB_ENV"
          echo "--- errori distinti (senza numero di riga), i primi 40 ---"
          grep '^psql:.*ERROR' restore.err | sed -E 's/^psql:backup\.sql:[0-9]+: //' | sort | uniq -c | sort -rn | head -40 | tee errori_distinti.txt || true

      - name: Conta le righe nel dump, nel ripristinato e nel vivo
        env:
          SOURCE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # 1) righe dentro i blocchi COPY del dump: è il riferimento del verdetto
          python3 - <<'PY'
          import re
          conta, tab = {}, None
          with open('backup.sql', encoding='utf-8', errors='replace') as f:
              for r in f:
                  if tab is None:
                      m = re.match(r'COPY ("?[\w]+"?)\.("?[\w]+"?) ', r)
                      if m:
                          tab = m.group(1).strip('"') + '.' + m.group(2).strip('"'); conta[tab] = 0
                  elif r.startswith('\\.'):
                      tab = None
                  else:
                      conta[tab] += 1
          with open('conta_dump.tsv', 'w', encoding='utf-8') as o:
              for t in sorted(conta): o.write(f"{t}\t{conta[t]}\n")
          print('Tabelle nel dump:', len(conta), '— righe:', sum(conta.values()))
          PY
          # 2) righe nel ripristinato e nel vivo
          cat > conta.sql <<'SQL'
          select n.nspname||'.'||c.relname as t,
                 (xpath('/row/c/text()', query_to_xml(format('select count(*) as c from %I.%I', n.nspname, c.relname), false, true, '')))[1]::text::bigint as n
          from pg_class c join pg_namespace n on n.oid = c.relnamespace
          where c.relkind = 'r' and n.nspname in ('public','planning','cpt_admin','archivio','auth')
          order by 1;
          SQL
          psql "$TARGET_URL" -At -F $'\t' -f conta.sql > conta_ripristinato.tsv
          psql "$SOURCE_URL" -At -F $'\t' -f conta.sql > conta_vivo.tsv
          echo "Tabelle nel ripristinato: $(wc -l < conta_ripristinato.tsv) — nel vivo: $(wc -l < conta_vivo.tsv)"

      - name: Confronta e scrivi il verdetto
        id: verdetto
        env:
          SOURCE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, subprocess
          def leggi(p):
              d = {}
              for r in open(p, encoding='utf-8'):
                  r = r.rstrip('\n')
                  if not r: continue
                  t, n = r.split('\t'); d[t] = int(n)
              return d
          dump, rip, vivo = leggi('conta_dump.tsv'), leggi('conta_ripristinato.tsv'), leggi('conta_vivo.tsv')
          # verdetto: ripristinato == dump, tabella per tabella (auth solo informativo)
          ko, warn, ok = [], [], []
          for t, nd in sorted(dump.items()):
              nr = rip.get(t)
              info = t.startswith('auth.')
              if nr is None:
                  (warn if info else ko).append((t, nd, None, 'nel dump ma non ripristinata'))
              elif nr != nd:
                  (warn if info else ko).append((t, nd, nr, 'righe diverse dal dump'))
              else:
                  ok.append((t, nd, nr, ''))
          # drift: cosa è cambiato nel vivo dopo il backup (informativo)
          drift = []
          for t, nv in sorted(vivo.items()):
              nd = dump.get(t)
              if nd is None:
                  drift.append((t, None, nv, 'tabella nata dopo il backup'))
              elif nd != nv:
                  drift.append((t, nd, nv, f'{nv - nd:+d} righe nel vivo'))
          esito = 'riuscita' if not ko else 'FALLITA'
          errori = int(os.environ.get('ERRORI_RESTORE', '0') or 0)
          durata = int(os.environ.get('DURATA_RESTORE', '0') or 0)
          try:
              distinti = open('errori_distinti.txt', encoding='utf-8', errors='replace').read().strip()
          except FileNotFoundError:
              distinti = ''
          righe_dump = sum(v for t, v in dump.items() if not t.startswith('auth.'))
          righe_rip = sum(v for t, v in rip.items() if t in dump and not t.startswith('auth.'))
          def tab(righe, c1='dump', c2='ripristinato'):
              s = [f"| tabella | {c1} | {c2} | note |", "|---|---:|---:|---|"]
              s += [f"| `{t}` | {'—' if a is None else a} | {'—' if b is None else b} | {p} |" for t, a, b, p in righe]
              return s + [""]
          s = [f"# Prova di ripristino — **{esito}**", "",
               f"Backup: `{os.environ.get('BACKUP_NOME','?')}` · ripristino in {durata}s con {errori} errori psql · "
               f"tabelle del dump: {len(ok)} identiche, {len(warn)} avvisi (auth), {len(ko)} fallite · "
               f"righe (senza auth): dump {righe_dump:,} / ripristinate {righe_rip:,}", ""]
          if ko: s += ["## Tabelle fallite (public/planning/cpt_admin/archivio)", ""] + tab(ko)
          if warn: s += ["## Avvisi (schema auth, informativo)", ""] + tab(warn)
          if drift: s += [f"## Cambiato nel vivo dopo il backup ({len(drift)} tabelle, informativo)", ""] + tab(drift, 'dump', 'vivo')
          if distinti: s += ["## Errori psql più frequenti", "", "```", distinti, "```", ""]
          open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8').write('\n'.join(s))
          print('\n'.join(s))
          dettaglio = {'ko': ko, 'avvisi': warn, 'drift': drift[:80], 'errori_distinti': distinti[:4000],
                       'tabelle_ok': len(ok), 'righe_dump': righe_dump, 'righe_ripristinato': righe_rip,
                       'immagine': 'supabase/postgres:17.6.1.177', 'run': os.environ.get('GITHUB_RUN_ID')}
          sql = """
          create table if not exists public.s_backup_prove (
            id bigint generated always as identity primary key,
            eseguita_il timestamptz not null default now(),
            backup_nome text not null,
            esito text not null,
            tabelle_ok int, tabelle_avvisi int, tabelle_ko int,
            errori_restore int, durata_s int,
            dettaglio jsonb
          );
          comment on table public.s_backup_prove is 'Prove di ripristino del backup notturno (workflow restore-test.yml del gestionale). Una riga per prova; scrive solo il workflow via connessione diretta.';
          alter table public.s_backup_prove enable row level security;
          do $$ begin
            if not exists (select 1 from pg_policies where schemaname='public' and tablename='s_backup_prove' and policyname='s_backup_prove_sel') then
              create policy s_backup_prove_sel on public.s_backup_prove for select to authenticated
                using ((select public.is_segreteria()) or (select public.is_coordinatore()));
            end if;
          end $$;
          revoke all on public.s_backup_prove from anon;
          insert into public.s_backup_prove (backup_nome, esito, tabelle_ok, tabelle_avvisi, tabelle_ko, errori_restore, durata_s, dettaglio)
          values (:'nome', :'esito', :ok, :warn, :ko, :err, :dur, :'det'::jsonb);
          """
          open('verdetto.sql', 'w', encoding='utf-8').write(sql)
          subprocess.run(['psql', os.environ['SOURCE_URL'], '-v', 'ON_ERROR_STOP=1', '-q',
                          '-v', f"nome={os.environ.get('BACKUP_NOME','?')}", '-v', f'esito={esito}',
                          '-v', f'ok={len(ok)}', '-v', f'warn={len(warn)}', '-v', f'ko={len(ko)}',
                          '-v', f'err={errori}', '-v', f'dur={durata}',
                          '-v', 'det=' + json.dumps(dettaglio, ensure_ascii=False),
                          '-f', 'verdetto.sql'], check=True)
          print('Verdetto scritto in public.s_backup_prove')
          if ko:
              raise SystemExit(f'Prova FALLITA: {len(ko)} tabelle non tornate come nel dump')
          PY

      # Se la prova si è fermata PRIMA del verdetto (Drive, passphrase, container),
      # l'ufficio deve saperlo lo stesso: una riga con l'errore, non il silenzio.
      - name: Registra il fallimento anche se il verdetto non è stato scritto
        if: failure() && steps.verdetto.outcome != 'failure'
        env:
          SOURCE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          [ -n "${SOURCE_URL:-}" ] || { echo "SUPABASE_DB_URL assente: non posso registrare"; exit 0; }
          psql "$SOURCE_URL" -q -v ON_ERROR_STOP=0 \
            -v nome="${BACKUP_NOME:-(backup non scaricato)}" -v run="${GITHUB_RUN_ID}" \
            -c "insert into public.s_backup_prove (backup_nome, esito, dettaglio) select :'nome', 'ERRORE prima del verdetto', jsonb_build_object('run', :'run') where to_regclass('public.s_backup_prove') is not null;" || true

name: Backup DB (giornaliero)

# Esegue un dump logico del database (schemi public + planning + cpt_admin +
# archivio: TUTTI i dati del gestionale, incluse visite_audit e le tabelle
# archiviate), lo comprime e lo CIFRA con AES256, poi lo carica come artifact
# scaricabile dai collaboratori del repo (conservato 90 giorni). Gratuito.
# Nessun dato in chiaro viene salvato nel repository.
# CONSIGLIO: una volta al mese scaricare manualmente l'ultimo artifact da
# Actions -> Backup DB e salvarlo su Drive come copia fuori da GitHub.
#
# Secret richiesti (Settings -> Secrets and variables -> Actions):
#   SUPABASE_DB_URL     stringa di connessione Postgres (Supabase -> Project Settings
#                       -> Database -> Connection string -> URI). Usare il pooler o
#                       la connessione diretta. Contiene la password del DB.
#   BACKUP_PASSPHRASE   passphrase con cui viene cifrato il backup (scegline una lunga).
#
# Ripristino di un backup:
#   gpg --batch --passphrase '<BACKUP_PASSPHRASE>' -d backup_XXXX.sql.gz.gpg | gunzip > backup.sql
#   psql '<SUPABASE_DB_URL>' -f backup.sql

on:
  schedule:
    - cron: '0 2 * * *'   # ogni notte alle 02:00 UTC (04:00 italiane)
  workflow_dispatch:       # avvio manuale dal tab Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Installa client PostgreSQL 17
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump + compressione + cifratura
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL:-}" ] || [ -z "${PASS:-}" ]; then
            echo "Secret SUPABASE_DB_URL e/o BACKUP_PASSPHRASE mancanti."; exit 1
          fi
          # Il runner ha gia' la 16 nel PATH: forziamo il pg_dump della 17
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          pg_dump --version
          TS=$(date +%Y%m%d_%H%M%S)
          pg_dump "$DB_URL" --no-owner --no-privileges \
            --schema=public --schema=planning --schema=cpt_admin --schema=archivio \
            | gzip -9 > "backup_${TS}.sql.gz"
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$PASS" "backup_${TS}.sql.gz"
          rm -f "backup_${TS}.sql.gz"
          echo "TS=${TS}" >> "$GITHUB_ENV"

      - name: Carica il backup cifrato come artifact
        uses: actions/upload-artifact@v6
        with:
          name: db-backup-${{ env.TS }}
          path: 'backup_*.sql.gz.gpg'
          retention-days: 90

      # Copia del backup (sempre cifrato) nella cartella "Backup_Gestionale"
      # del Drive di cptpd, via service account con delega. Se il secret
      # GOOGLE_SERVICE_ACCOUNT_JSON non è configurato, il passo viene saltato.
      # Rotazione: i backup su Drive più vecchi di 60 giorni vengono cestinati.
      - name: Carica su Google Drive (Backup_Gestionale)
        env:
          GSA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GSA_JSON:-}" ]; then
            echo "Secret GOOGLE_SERVICE_ACCOUNT_JSON assente: salto l'upload su Drive."
            exit 0
          fi
          pip -q install google-auth requests
          python3 - <<'PY'
          import os, json, glob, datetime, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          # Il secret può arrivare con BOM/spazi iniziali (copia da Windows): li rimuoviamo
          info = json.loads(os.environ['GSA_JSON'].lstrip('﻿\r\n\t ').strip())
          creds = service_account.Credentials.from_service_account_info(
              info, scopes=['https://www.googleapis.com/auth/drive'],
              subject='cptpd@did.formedilpadova.it')
          creds.refresh(Request())
          H = {'Authorization': f'Bearer {creds.token}'}

          # cartella Backup_Gestionale (creata se manca)
          q = "name = 'Backup_Gestionale' and mimeType = 'application/vnd.google-apps.folder' and trashed = false"
          r = requests.get('https://www.googleapis.com/drive/v3/files',
                           params={'q': q, 'fields': 'files(id)'}, headers=H).json()
          if r.get('files'):
              fid = r['files'][0]['id']
          else:
              fid = requests.post('https://www.googleapis.com/drive/v3/files',
                                  headers={**H, 'Content-Type': 'application/json'},
                                  json={'name': 'Backup_Gestionale',
                                        'mimeType': 'application/vnd.google-apps.folder'}).json()['id']

          # upload (resumable) del dump cifrato
          path = glob.glob('backup_*.sql.gz.gpg')[0]
          init = requests.post(
              'https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable',
              headers={**H, 'Content-Type': 'application/json'},
              json={'name': os.path.basename(path), 'parents': [fid]})
          init.raise_for_status()
          with open(path, 'rb') as f:
              data = f.read()
          up = requests.put(init.headers['Location'], data=data)
          up.raise_for_status()
          print('Caricato su Drive:', path, f'({len(data)/1e6:.1f} MB)')

          # rotazione: cestina i backup più vecchi di 60 giorni
          lim = (datetime.datetime.utcnow() - datetime.timedelta(days=60)).strftime('%Y-%m-%dT%H:%M:%S')
          q2 = f"'{fid}' in parents and name contains 'backup_' and modifiedTime < '{lim}' and trashed = false"
          for o in requests.get('https://www.googleapis.com/drive/v3/files',
                                params={'q': q2, 'fields': 'files(id,name)'},
                                headers=H).json().get('files', []):
              requests.patch(f"https://www.googleapis.com/drive/v3/files/{o['id']}",
                             headers={**H, 'Content-Type': 'application/json'},
                             json={'trashed': True})
              print('Cestinato backup vecchio:', o['name'])
          PY
